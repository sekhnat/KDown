[workspace]
resolver = "2"
members = ["crates/engine", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Group priority -1 so the individual entries below override the group
# without clippy::lint_groups_priority firing.
all = { level = "warn", priority = -1 }
# Follow-up cleanup (task 6.3 assessment, 2026-09-27): the engine does not
# yet pass these groups (~350 library / ~3100 all-target warnings), so they
# stay declared-but-off. The engine member opts into this workspace set, and
# the CI lane runs `cargo clippy -- -D warnings`, so inheriting them as
# warnings would break the lane before the cleanup lands. Turning each back
# to "warn" is the follow-up; `clippy::all` and the rustc lints above are
# enforced today.
pedantic = "allow"
unwrap_used = "allow"
expect_used = "allow"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"