[package]
name = "kdown-engine"
description = "High-performance, resumable download engine library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }
rand = "0.9"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio", "service", "server-auto"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
bytes = "1"
fs2 = "0.4"

[dev-dependencies]
proptest = "1"
criterion = "0.5"
tempfile = "3"
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"

[[bench]]
name = "throughput"
harness = false
