[package]
name = "kdown-app"
description = "Local KDown download manager service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kdown-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "process"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["json", "tokio"] }
http = "1"
rand = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
utoipa = { version = "5", features = ["uuid"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
