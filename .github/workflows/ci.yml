name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # --locked keeps every platform on the reviewed, tracked dependency
      # set: a resolution drift fails loudly here instead of silently
      # changing what the MSRV and platform jobs verify.
      - run: cargo build --workspace --all-targets --locked
      # Full matrix includes positional writes, rename-over-existing,
      # preallocation, crash/resume, segmented, and security tests.
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      # Audit the committed lockfiles directly; cargo-audit does not resolve
      # or rewrite dependencies. Keep warnings visible, but fail on advisories.
      # RUSTSEC-2026-0009 has a narrow, documented dev-only exception in
      # .cargo/audit.toml due to its Rust 1.88 patch exceeding our Rust 1.85 MSRV;
      # no other RustSec IDs are ignored. The unmaintained-parser warning is
      # tracked in docs/acceptance-v1.md for planned migration.
      - uses: actions-rust-lang/audit@v1
        with:
          file: Cargo.lock
          denyWarnings: false
          createIssues: false
      - uses: actions-rust-lang/audit@v1
        with:
          file: fuzz/Cargo.lock
          denyWarnings: false
          createIssues: false

  property-fuzz-smoke:
    name: property-fuzz-smoke
    runs-on: ubuntu-latest
    env:
      # Fixed seed + finite cases make this additional PR lane reproducible
      # and bounded. The all-OS matrix still runs each property's normal count.
      PROPTEST_RNG_SEED: "2026092701"
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Bounded deterministic scheduler properties
        run: cargo test --locked -p kdown-engine --lib internal_tests::scheduler_property_tests -- --test-threads=1
      - name: Adversarial parser corpus smoke
        run: cargo test --locked -p kdown-engine --lib fuzz_targets::smoke::corpus_smoke_no_panics -- --exact
      - name: Compile all libFuzzer targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets


  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          toolchain: 1.98.1
      - run: cargo fmt --all -- --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Verifies the Rust version advertised in Cargo metadata, on the exact
    # tracked dependency set. RUSTUP_TOOLCHAIN (set by the action) overrides
    # rust-toolchain.toml, so this job cannot silently drift onto the newer
    # pinned toolchain; the matrix above keeps testing that toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  bench-check:
    # GitHub-hosted hardware/load differs from the local benchmark baseline;
    # run the suite as a smoke test here and compare on matching hardware locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench throughput --no-run
      - run: ./scripts/bench_check.sh --smoke
