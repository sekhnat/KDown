name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # --locked keeps every platform on the reviewed, tracked dependency
      # set: a resolution drift fails loudly here instead of silently
      # changing what the MSRV and platform jobs verify.
      # The lane runs build + the full matrix + clippy and records a release-
      # evidence fragment for this OS, so a green run on one platform cannot
      # stand in for the three-OS matrix (task 5.4).
      - name: Correctness lane (three-OS matrix evidence)
        run: ./scripts/ci_lane.sh correctness
      # Durability gate for this OS: platform filesystem/publication matrix
      # plus checkpoint crash/restart recovery, recorded separately from the
      # correctness lane.
      - name: Durability lane (platform matrix evidence)
        run: ./scripts/ci_lane.sh durability
      - name: Upload release-evidence fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-test-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/evidence/
          if-no-files-found: warn
          retention-days: 90

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      # Audit the committed lockfiles directly; cargo-audit does not resolve
      # or rewrite dependencies. Keep warnings visible, but fail on advisories.
      # RUSTSEC-2026-0009 has a narrow, documented dev-only exception in
      # .cargo/audit.toml due to its Rust 1.88 patch exceeding our Rust 1.85 MSRV;
      # no other RustSec IDs are ignored. The unmaintained-parser warning is
      # tracked in docs/acceptance-v1.md for planned migration.
      - id: audit_workspace
        uses: actions-rust-lang/audit@v1
        with:
          file: Cargo.lock
          denyWarnings: false
          createIssues: false
      - id: audit_fuzz
        uses: actions-rust-lang/audit@v1
        with:
          file: fuzz/Cargo.lock
          denyWarnings: false
          createIssues: false
      # Record the audit outcome even when an audit step fails: a failed
      # audit is blocking and never waivable (task 5.4).
      - name: Record dependency-audit evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/evidence
          status=passed
          extra=--approves-release
          if [ "${{ steps.audit_workspace.outcome }}" != success ] || [ "${{ steps.audit_fuzz.outcome }}" != success ]; then
            status=failed
            extra=
          fi
          python3 scripts/evidence_io.py record \
            --out artifacts/evidence/security_dependency_audit.json \
            --id security_dependency_audit \
            --category security \
            --status "$status" \
            --source 'ci.yml#dependency-audit' \
            --detail 'Locked lockfile advisory audit (workspace + fuzz) with reviewed exceptions in .cargo/audit.toml.' \
            --command 'actions-rust-lang/audit@v1 file=Cargo.lock' \
            --command 'actions-rust-lang/audit@v1 file=fuzz/Cargo.lock' \
            --toolchain 'audit action v1; rust 1.98.1' \
            --max-age-days 14 $extra
      - name: Upload release-evidence fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dependency-audit-${{ github.run_id }}
          path: artifacts/evidence/
          if-no-files-found: warn
          retention-days: 90

  property-fuzz-smoke:
    name: property-fuzz-smoke
    runs-on: ubuntu-latest
    env:
      # Fixed seed + finite cases make this additional PR lane reproducible
      # and bounded. The all-OS matrix still runs each property's normal count.
      PROPTEST_RNG_SEED: "2026092701"
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Bounded deterministic scheduler properties
        run: cargo test --locked -p kdown-engine --lib internal_tests::scheduler_property_tests -- --test-threads=1
      - name: Adversarial parser corpus smoke
        run: cargo test --locked -p kdown-engine --lib fuzz_targets::smoke::corpus_smoke_no_panics -- --exact
      - name: Compile all libFuzzer targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets
      # Guard the unavailable-tool semantics: a missing checker must record
      # `unavailable` and exit non-zero, never report a pass (task 5.3).
      - name: Dynamic-check evidence self-test
        run: ./scripts/dynamic_checks.sh self-test
      # Guard the release gate itself: missing, failed, stale, non-approving,
      # unavailable and untriaged-defect evidence must all block the verdict,
      # and PR smoke must never approve a release (tasks 5.3/5.4).
      - name: Release-gate evidence self-test
        run: python3 scripts/release_gate.py self-test

  resource-bound:
    # Resource-bound gate on Linux: the admission ledger, HTTP ingress bounds
    # and budget/high-water telemetry run as their own evidence lane so the
    # category cannot silently vanish from the release evidence (task 5.4).
    name: resource-bound
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Resource-bound lane
        run: ./scripts/ci_lane.sh resource-bound
      - name: Upload release-evidence fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-resource-bound-${{ github.run_id }}
          path: artifacts/evidence/
          if-no-files-found: warn
          retention-days: 90

  interoperability:
    # Interoperability gate on Linux: HTTP range/validator/CDN/proxy and
    # network-condition behavior on H1 and H2 (task 5.4).
    name: interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Interoperability lane
        run: ./scripts/ci_lane.sh interoperability
      - name: Upload release-evidence fragments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-interoperability-${{ github.run_id }}
          path: artifacts/evidence/
          if-no-files-found: warn
          retention-days: 90


  web-e2e:
    # Frontend lane (task 14): API generation drift check, lint, unit tests,
    # frontend build, the bundled host build, and real-browser acceptance.
    # The correctness/durability matrix and MSRV stay Node-free.
    name: web-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: API drift check (regeneration must not change tracked files)
        run: |
          cargo run --locked -p kdown-app --example export_openapi -- web/openapi.json
          (cd web && npm run generate:api)
          git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Unit tests
        run: npx vitest run
        working-directory: web
      - name: Frontend build
        run: npm run build
        working-directory: web
      - name: Bundled host build
        run: cargo build --locked --release -p kdown-app --features bundled-web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser acceptance
        run: ../scripts/e2e_web.sh
        working-directory: web


  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          toolchain: 1.98.1
      - run: cargo fmt --all -- --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Verifies the Rust version advertised in Cargo metadata, on the exact
    # tracked dependency set. RUSTUP_TOOLCHAIN (set by the action) overrides
    # rust-toolchain.toml, so this job cannot silently drift onto the newer
    # pinned toolchain; the matrix above keeps testing that toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  bench-check:
    # GitHub-hosted hardware/load differs from any recorded baseline; run the
    # suite as a scenario smoke here (task 6.4) and compare against reviewed
    # baselines only on matched hardware (scripts/bench_check.sh --release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench throughput --no-run
      - name: Benchmark smoke (scenario integrity + gate self-test)
        run: ./scripts/bench_check.sh --smoke
      - name: Upload benchmark smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bench-smoke-${{ github.run_id }}
          path: |
            artifacts/evidence/
            crates/engine/benches/results/suite/pr-smoke/
          if-no-files-found: warn
          retention-days: 90
